name: LinkedIn scheduled publishing

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scheduled-publishing
  cancel-in-progress: false

jobs:
  publish-due-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run the scheduled-post worker
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC URL is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC token request is unavailable}"
          token_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=postflow-scheduled-publishing"
          token="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${token_url}" | jq --exit-status --raw-output '.value')"
          curl --fail-with-body --silent --show-error --max-time 300 \
            --retry 2 --retry-all-errors --retry-delay 5 \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            https://linkdin-tool.vercel.app/api/worker/tick
